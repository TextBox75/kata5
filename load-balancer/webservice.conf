upstream odd_1 {
    zone powers 64k;
    resolver consul:8600 valid=5s;
    server service.consul service=odd_service_1 resolve;
}

upstream odd_2 {
    zone powers 64k;
    resolver consul:8600 valid=5s;
    server service.consul service=odd_service_2 resolve;
}

server {
    listen 80;

    add_header X-Backend $upstream_addr always;

    location /odd1/ {
        proxy_pass http://odd_1/;
    }

    location /odd2/ {
        proxy_pass http://odd_2/;
    }

    location / {
        return 404;
    }
}
