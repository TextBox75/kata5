upstream powers_1 {
    zone powers 64k;
    resolver consul:8600 valid=5s;
    server service.consul service=powers_service_1 resolve;
}

upstream powers_2 {
    zone powers 64k;
    resolver consul:8600 valid=5s;
    server service.consul service=powers_service_2 resolve;
}

server {
    listen 80;

    add_header X-Backend $upstream_addr always;

    location /powers1/ {
        proxy_pass http://powers_1/;
    }

    location /powers2/ {
        proxy_pass http://powers_2/;
    }

    location / {
        return 404;
    }
}
