upstream even_1 {
    zone powers 64k;
    resolver consul:8600 valid=5s;
    server service.consul service=even_service_1 resolve;
}

upstream even_2 {
    zone powers 64k;
    resolver consul:8600 valid=5s;
    server service.consul service=even_service_2 resolve;
}

server {
    listen 80;

    add_header X-Backend $upstream_addr always;

    location /even1/ {
        proxy_pass http://even_1/;
    }

    location /even2/ {
        proxy_pass http://even_2/;
    }

    location / {
        return 404;
    }
}
